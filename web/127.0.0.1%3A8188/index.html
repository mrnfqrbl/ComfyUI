<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ComfyUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" type="text/css" href="user.css" />
  <link rel="stylesheet" type="text/css" href="materialdesignicons.min.css" />
  <style>
    #messageOverlay {
      position: fixed;
      background-color: rgba(34, 49, 63, 0.6); /* 深色半透明背景 */
      color: #ECF0F1; /* 高对比度亮色字体 */
      padding: 5px; /* 减少内边距 */
      border-radius: 5px; /* 减少圆角 */
      cursor: move;
      z-index: 10000;
      opacity: 1;
      font-size: 12px; /* 调整字体大小 */
      width: 350px; /* 设置固定宽度 */
      height: 185px; /* 限制最大高度 */
      overflow-y: auto; /* 允许垂直滚动 */
      pointer-events: auto; /* 默认允许点击 */
      transition: background-color 0.3s ease, opacity 0.3s ease;
      line-height: 1.2; /* 调整行高 */
      word-break: break-word; /* 允许长单词换行 */
    }

    #messageOverlay.through {
      pointer-events: none; /* 穿透模式 */
      background-color: rgba(52, 73, 94, 0.3); /* 穿透时颜色更淡 */
      opacity: 0.5;
    }

    #messageOverlay:hover {
      background-color: rgba(44, 62, 80, 0.7); /* 悬停时颜色加深 */
    }

    #messageOverlay.through:hover {
      background-color: rgba(52, 73, 94, 0.5); /* 悬停时颜色加深 */
    }

    #messageOverlay #toggleThrough {
      position: absolute;
      top: 2px;
      right: 2px;
      background-color: rgba(236, 240, 241, 0.2);
      color: #ECF0F1;
      border: none;
      padding: 1px 3px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
      outline: none;
      pointer-events: auto; /* 确保按钮可以被点击 */
    }

    #messageOverlay #toggleThrough:hover {
      background-color: rgba(236, 240, 241, 0.4);
    }

    .messageLine {
      margin-bottom: 3px; /* 消息之间的间距 */
    }

    .messageLine.error {
      color: red;
      font-size: 14px;
      font-weight: bold;
    }

    #connectionError {
      color: red;
      font-size: 16px;
      font-weight: bold;
      display: none; /* 初始隐藏 */
    }

    #levelFilter {
      margin-top: 5px;
    }
  </style>
  <script>
    let ws;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 4;
    const reconnectDelayBase = 2; // 指数退避的基数
    let wsUrl;
    let messageOverlay;
    let connectionErrorElement;
    let 任务id; // 保存任务 ID
    let 请求体; // 保存请求体，用于重新发送

    const logLevels = ['info', 'debug', 'error'];
    let currentLogLevel = 'info'; // 默认级别

    const intervalId = setInterval(() => {
      if (window.comfyAPI && window.comfyAPI.api && window.comfyAPI.api.api) {
        // 1. 设置 file_url (如果需要)
        window.comfyAPI.api.api.file_url = window.location.protocol + "//" + window.comfyAPI.api.api.api_host;
        console.log("file_url 设置成功:", window.comfyAPI.api.api.file_url);

        // 2. 修改 fileURL 函数
        window.comfyAPI.api.api.fileURL = function(route) {
          return window.comfyAPI.api.api.file_url + route;
        };
        console.log("fileURL 函数已修改");

        clearInterval(intervalId); // 停止定时器

        // 创建消息悬浮窗
        messageOverlay = document.createElement('div');
        messageOverlay.id = 'messageOverlay';
        document.body.appendChild(messageOverlay);

        // 设置初始位置为右上角
        function setInitialPosition() {
          messageOverlay.style.top = '20px'; // 距离顶部 20px
          messageOverlay.style.right = '20px'; // 距离右侧 20px
          messageOverlay.style.left = 'auto'; // 移除 left 属性，使用 right 属性
        }
        setInitialPosition();

        // 创建穿透模式切换按钮
        const toggleThroughButton = document.createElement('button');
        toggleThroughButton.id = 'toggleThrough';
        toggleThroughButton.textContent = '穿透';
        messageOverlay.appendChild(toggleThroughButton);

        let isDragging = false;
        let offsetX, offsetY;

        // 拖动事件
        messageOverlay.addEventListener('mousedown', (e) => {
          if (e.target !== toggleThroughButton) {
            isDragging = true;
            offsetX = e.clientX - messageOverlay.offsetLeft;
            offsetY = e.clientY - messageOverlay.offsetTop;
            messageOverlay.style.cursor = 'grabbing';
          }
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
          messageOverlay.style.cursor = 'move';
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          messageOverlay.style.left = (e.clientX - offsetX) + 'px';
          messageOverlay.style.top = (e.clientY - offsetY) + 'px';
          messageOverlay.style.right = 'auto'; // 拖动时移除 right 属性，使用 left 属性
        });

        // 切换穿透模式
        toggleThroughButton.addEventListener('click', () => {
          messageOverlay.classList.toggle('through');
          toggleThroughButton.textContent = messageOverlay.classList.contains('through') ? '取消穿透' : '穿透';
        });

        // 创建连接错误提示元素
        connectionErrorElement = document.createElement('div');
        connectionErrorElement.id = 'connectionError';
        connectionErrorElement.textContent = '服务器连接失败，正在重试...';
        messageOverlay.appendChild(connectionErrorElement);

        // 创建级别过滤选择器
        const levelFilterSelect = document.createElement('select');
        levelFilterSelect.id = 'levelFilter';
        logLevels.forEach(level => {
          const option = document.createElement('option');
          option.value = level;
          option.textContent = level.toUpperCase();
          levelFilterSelect.appendChild(option);
        });
        levelFilterSelect.value = currentLogLevel; // 设置默认值
        messageOverlay.appendChild(levelFilterSelect);

        // 级别过滤事件
        levelFilterSelect.addEventListener('change', () => {
          currentLogLevel = levelFilterSelect.value;
          console.log("日志级别已设置为:", currentLogLevel);
        });

        // 页面渲染完毕后执行的代码
        let url = "http://192.168.1.115:7878/api/cd/comfyui_info";
        let baseurl ="http://192.168.1.115:7878"
        请求体 = {
          "基础url": "http://192.168.1.104:8188",
          "获取列表接口": "/api/mrnf/get",
          "下载接口": "/api/mrnf/down",
        };

        async function 发起请求(url, 请求体) {
          try {
            const 响应 = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(请求体),
            });

            if (!响应.ok) {
              throw new Error(`HTTP 错误! 状态: ${响应.status}`);
            }

            const 数据 = await 响应.json();
            console.log("请求成功! 响应数据:", 数据);
            任务id = 数据.任务id; // 保存任务 ID
            console.log("获取到的 任务id:", 任务id);
            return 数据; // 返回响应数据，方便后续处理
          } catch (错误) {
            console.error("请求失败:", 错误);
            throw 错误; // 重新抛出错误，让调用者处理
          }
        }

        // 调用发起请求函数
        发起请求(url, 请求体)
                .then((数据) => {
                  // 在这里处理响应数据

                  console.log("处理响应数据:", 数据);
                  const ws接口 = 数据.ws接口为; // 获取返回的 ws 接口
                  console.log("获取到的 ws 接口:", ws接口);


                  wsUrl = baseurl + ws接口; // 拼接 WebSocket URL
                  console.log("拼接后的 WebSocket URL:", wsUrl);

                  // 连接 WebSocket
                  connectWebSocket();

                })
                .catch((错误) => {
                  // 在这里处理错误
                  console.error("处理错误:", 错误);
                });
      } else {
        console.log("等待 window.comfyAPI.api.api...");
      }
    }, 100); // 每 100 毫秒检查一次

    function connectWebSocket() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("WebSocket 连接成功!");
        reconnectAttempts = 0; // 重置重连次数
        connectionErrorElement.style.display = 'none'; // 隐藏错误消息
        logMessage("ComfyUI 页面已上线!", 'info');

        ws.send(JSON.stringify({"msessage": "ComfyUI 页面已上线", "level": "info"}))
        // 发送任务 ID
        sendTaskId();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const message = data.message;
          const level = data.level || 'info'; // 默认级别为 info
          logMessage(message, level);

          // 检查是否需要重新发送 POST 请求
          if (message.includes("请重新提交 ComfyUI 信息以启动任务") && level === 'warning') {
            console.warn("收到服务器警告，重新发送 POST 请求...");
            重新发送Post请求();
          }
        } catch (e) {
          logMessage(event.data, 'info'); // 无法解析 JSON，按普通消息处理
        }
      };

      ws.onclose = () => {
        console.log("WebSocket 连接关闭");
        reconnect();
      };

      ws.onerror = (error) => {
        console.error("WebSocket 发生错误:", error);
        reconnect();
      };
    }

    function reconnect() {
      if (reconnectAttempts < maxReconnectAttempts) {
        reconnectAttempts++;
        const delay = reconnectDelayBase ** reconnectAttempts; // 指数退避
        console.log(`尝试重新连接 (第 ${reconnectAttempts} 次) 在 ${delay} 秒后...`);
        connectionErrorElement.style.display = 'block'; // 显示错误消息
        setTimeout(() => {
          connectWebSocket();
        }, delay * 1000);
      } else {
        console.error("达到最大重连次数，放弃重连");
        connectionErrorElement.textContent = '服务器连接失败，请检查服务器状态。';
        connectionErrorElement.classList.add('error'); // 添加错误样式
        connectionErrorElement.style.display = 'block';
      }
    }

    function logMessage(message, level) {
      if (logLevels.indexOf(level) < logLevels.indexOf(currentLogLevel)) {
        return; // 级别低于当前过滤级别，不显示
      }

      const messageLine = document.createElement('div');
      messageLine.classList.add('messageLine');
      messageLine.textContent = `[${level.toUpperCase()}] ${message}`;

      if (level === 'error') {
        messageLine.classList.add('error');
      }

      messageOverlay.appendChild(messageLine);
      messageOverlay.scrollTop = messageOverlay.scrollHeight;
    }

    function sendTaskId() {
      if (ws && ws.readyState === WebSocket.OPEN && 任务id) {
        ws.send(JSON.stringify({ 任务id: 任务id, message: "发送任务 ID", level: 'info' }));
        console.log("已发送任务 ID:", 任务id);
      } else {
        console.warn("WebSocket 未连接或任务 ID 未定义，无法发送任务 ID");
      }
    }

    async function 重新发送Post请求() {
      let url = "http://192.168.1.115:7878/api/cd/comfyui_info";
      try {
        const 响应 = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(请求体),
        });

        if (!响应.ok) {
          throw new Error(`HTTP 错误! 状态: ${响应.status}`);
        }

        const 数据 = await 响应.json();
        console.log("重新发送 POST 请求成功! 响应数据:", 数据);
        任务id = 数据.任务id; // 保存新的任务 ID
        console.log("获取到的新的 任务id:", 任务id);
        sendTaskId(); // 发送新的任务 ID

      } catch (错误) {
        console.error("重新发送 POST 请求失败:", 错误);
      }
    }
  </script>
  <script type="module" crossorigin src="https://mrnfqrbl.github.io/assets/index-luE7cl5Z.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-N6v3Feoi.css">
